name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: scope
        name: Classify the base/head diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Include deletions and both rename paths; preserve unusual filenames.
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          docs_only=true
          while IFS= read -r -d '' file; do
            case "$file" in
              *.md|*.markdown) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              AGENTS.md|CONTRIBUTING.md|.agents/*|schemas/*|types/*|runtime/*|test-vectors/*|conformance/*|package.json|package-lock.json|.github/*|scripts/*)
                docs_only=false
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          test -s "$RUNNER_TEMP/changed-files" || docs_only=false
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo '### Protocol pull-request scope'
            echo
            echo "- base: \`$BASE_SHA\`"
            echo "- head: \`$HEAD_SHA\`"
            echo "- non-normative docs only: \`$docs_only\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check scope regression cases
        run: node --test scripts/ci-scope.test.mjs

  conformance:
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - run: npm install --global npm@12.0.2 --registry=https://registry.npmjs.org
      - run: test "$(npm --version)" = "12.0.2"
      - run: npm ci
      - run: npm run check
      - run: npm run check:distribution
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'protocol-check-v3' \
            --arg classification 'full' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/conformance.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/conformance.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/conformance.json
          if-no-files-found: warn
