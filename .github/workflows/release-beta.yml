name: Release npm beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable prerelease version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: protocol-npm-beta-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-beta
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2 --registry=https://registry.npmjs.org
      - run: |
          test "${{ inputs.version }}" = "$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - run: npm run check
      - run: npm run check:distribution
      - run: npm publish --provenance --access public --tag beta --registry=https://registry.npmjs.org
      - run: EXPECT_GIT_HEAD="${GITHUB_SHA}" npm run verify:registry-beta -- --version "${{ inputs.version }}"
